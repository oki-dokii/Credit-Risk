split:
  val_size: 0.20
  holdout_size: 0.20  # Stratified random holdout; not a temporal evaluation.
  random_state: 42
woe_encoder:
  n_bins: 10
  min_bin_pct: 0.05
  enforce_monotone: true
iv_threshold: 0.02
scorecard_scaler:
  pdo: 20
  base_score: 600
  base_odds: 30
logistic_regression:
  C: 1.0
  solver: lbfgs
  max_iter: 3000
  tol: 0.00000001
  random_state: 42
xgboost:
  n_estimators: 150
  max_depth: 3
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42
  n_jobs: 2
  eval_metric: logloss
monitoring:
  psi_alert_threshold: 0.10
  gini_alert_threshold: 0.05  # Absolute Gini points, not relative percent.
  calibration_gap_threshold: 0.03
approval_score: 620
